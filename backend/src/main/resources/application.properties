spring.application.name=backend

# Gizli ayarları (şifre) ayrı dosyadan oku — bu dosya GitHub'a gitmez
spring.config.import=optional:file:./local.properties

# Sunucu
server.port=8080
server.error.include-message=always

# PostgreSQL bağlantısı
spring.datasource.url=jdbc:postgresql://localhost:5432/aurelia_db
spring.datasource.username=postgres
# Şifre local.properties dosyasında

# JPA / Hibernate
# Tabloları biz SQL ile oluşturduk, Spring dokunmasın
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false