<form class="search-card" [formGroup]="searchForm" (ngSubmit)="search()" novalidate>
  @if (!compact()) {
    <div class="search-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2" />
        <path d="M3 10h18M8 3v4M16 3v4" />
      </svg>
      <span>Konaklamanızı<br>Planlayın</span>
    </div>
  }

  <div class="form-field">
    <label class="form-label" for="checkIn">Giriş Tarihi</label>
    <input
      id="checkIn"
      type="date"
      class="form-input"
      formControlName="checkIn"
      [min]="today"
      [class.is-invalid]="checkInError()">
    @if (checkInError(); as error) {
      <span class="form-error">{{ error }}</span>
    }
  </div>

  <div class="form-field">
    <label class="form-label" for="checkOut">Çıkış Tarihi</label>
    <input
      id="checkOut"
      type="date"
      class="form-input"
      formControlName="checkOut"
      [min]="searchForm.controls.checkIn.value || today"
      [class.is-invalid]="checkOutError()">
    @if (checkOutError(); as error) {
      <span class="form-error">{{ error }}</span>
    }
  </div>

  <div class="form-field">
    <label class="form-label" for="adults">Yetişkin</label>
    <input
      id="adults"
      type="number"
      class="form-input"
      formControlName="adults"
      min="1"
      max="10"
      [class.is-invalid]="guestError()">
  </div>

  <div class="form-field">
    <label class="form-label" for="children">Çocuk</label>
    <input
      id="children"
      type="number"
      class="form-input"
      formControlName="children"
      min="0"
      max="10"
      [class.is-invalid]="guestError()">
  </div>

  <button type="submit" class="btn btn-primary search-button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="18" height="18">
      <circle cx="11" cy="11" r="7" />
      <path d="M20 20l-3.5-3.5" />
    </svg>
    {{ compact() ? 'Aramayı Güncelle' : 'Müsait Odaları Ara' }}
  </button>

  @if (guestError(); as error) {
    <span class="form-error guest-error">{{ error }}</span>
  }
</form>
